  <body>
    <a class="skip-link" href="#view">본문으로 바로가기</a>
    <aside class="sidebar" id="erp-sidebar">
      <div class="sidebar-header">
        <a class="brand" href="/dashboard" aria-label="ERP 홈">
          <div>
            <strong>ERP</strong>
            <span>Our everyday workspace</span>
          </div>
        </a>
        <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-controls="erp-sidebar" aria-expanded="true" aria-label="왼쪽 메뉴 접기" title="메뉴 접기">
          <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#chevron-left" /></svg>
        </button>
      </div>
      <nav class="nav" aria-label="주 메뉴">
        <p class="nav-label">WORKSPACE</p>
        <a href="/dashboard" data-route="dashboard"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#dashboard" /></svg><span>대시보드</span></a>
        <p class="nav-label nav-label-records" id="nav-private-label">PRIVATE · 나의 업무</p>
        <div class="nav-group" data-menu-group="private" role="group" aria-labelledby="nav-private-label">

          <a href="/projects" data-route="projects"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#folder" /></svg><span>프로젝트</span></a>
          <a href="/chat" data-route="chat"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#chat" /></svg><span>팀 채팅</span></a>
          <a href="/receipts" data-route="receipts"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#receipt" /></svg><span>영수증</span></a>

    <main class="shell">
      <header class="topbar">
        <div class="topbar-title">
          <button class="sidebar-toggle sidebar-expand" id="sidebar-expand" type="button" aria-controls="erp-sidebar" aria-expanded="false" aria-label="왼쪽 메뉴 펼치기" title="메뉴 펼치기" hidden>
            <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#chevron-right" /></svg>
          </button>
          <h1 id="page-title">대시보드</h1>
        </div>
        <div class="topbar-actions">
          <div class="date-pill"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#calendar" /></svg><time id="today-label"></time></div>
          <div class="account-summary"><strong data-account-name></strong><span data-account-title></span></div>
          <a class="account-admin-link" href="/admin" data-admin-link hidden>관리자</a>
          <button class="secondary account-logout" type="button" data-logout>로그아웃</button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite" tabindex="-1"></section>

    <script src="/static/app.js?v=20261003-calendar-holidays" type="module"></script>
